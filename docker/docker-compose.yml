version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: quant-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in docker/.env}
      MYSQL_DATABASE: quant_db
      # 与 backend 同一时区：表中 created_at/updated_at 的 DEFAULT CURRENT_TIMESTAMP
      # 由 DB 侧生成，DB 用 UTC 会让审计时间比业务时间早 8 小时。
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 权威 schema：后端实际使用的表（其余表由 Hibernate ddl-auto:update 补齐）
      - ../modules/database/01_init_schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - quant-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: quant-backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in docker/.env}
      # 交易业务日/日切依赖本地时区（LocalDate.now()），容器默认 UTC 会让北京时间
      # 凌晨 00:00–08:00 落到前一交易日；这里与 Dockerfile 的 -Duser.timezone 一致锚定 CST。
      TZ: ${TZ:-Asia/Shanghai}
      # 容器部署默认开启 JWT 鉴权（本地 dev 保持关闭）；可用 AUTH_ENABLED=false 关闭
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in docker/.env}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?Set DEFAULT_ADMIN_PASSWORD in docker/.env}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # 探针必须打白名单内的接口：/api/data/overview 受 deny-by-default 保护，而本
      # profile 默认 AUTH_ENABLED=true，未带 token 一律 401 → wget 非 0 → 容器永远
      # unhealthy（任何 --wait / depends_on: service_healthy 编排都会超时）。
      # /api/system/** 在 WebMvcConfig 白名单内，且只读，适合做存活探针。
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/system/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - quant-network

volumes:
  mysql-data:

networks:
  quant-network:
    driver: bridge
