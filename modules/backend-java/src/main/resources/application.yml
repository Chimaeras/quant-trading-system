server:
  port: 8080
  # 前端与 API 同端口，访问 http://localhost:8080/ 查看页面

spring:
  application:
    name: quant-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/quant_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms

# JWT 配置
jwt:
  secret: quant-trading-system-secret-key-2026-change-in-production
  expiration: 86400000  # 24小时

# 日志配置
logging:
  level:
    root: INFO
    com.quant: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 历史行情：搜狐为主时一般无需再拉东财；为 true 时在搜狐有数据时仍拉东财并合并（搜狐优先，东财补缺）
historical:
  supplement-eastmoney: false

# 趋势选股打分（与《选股打分算法说明》一致）
scoring:
  trend:
    bias-threshold: 5.0
  # 多维度第一版：仅用库内 K 线+PE+行业聚合计算，不拉取外部 API（因子版本 multi_dim_compute_v1）
  multi-dim:
    compute-only-v1: true

backtest:
  cost:
    commission-rate: 0.0003
    min-commission: 5.0
    stamp-duty-rate: 0.001
    transfer-fee-rate: 0.00002
    slippage-bps: 2.0
