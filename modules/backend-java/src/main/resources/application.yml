server:
  port: 8080
  # 前端与 API 同端口，访问 http://localhost:8080/ 查看页面

spring:
  application:
    name: quant-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/quant_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  # Flyway: app schema source of truth (see classpath:db/migration)
  flyway:
    enabled: true
    locations: classpath:db/migration
    # First adoption on existing DBs that already have tables from ddl-auto / ops scripts
    baseline-on-migrate: true
  jpa:
    hibernate:
      # TEMPORARY for local/dev transition: Hibernate may still add/alter columns not yet in migrations.
      # Production profile (application-prod.yml) uses ddl-auto: validate — do not rely on update there.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
    open-in-view: false

# 日志配置
logging:
  level:
    root: INFO
    com.quant: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 历史行情：搜狐为主时一般无需再拉东财；为 true 时在搜狐有数据时仍拉东财并合并（搜狐优先，东财补缺）
historical:
  supplement-eastmoney: false

# 趋势选股打分（与《选股打分算法说明》一致）
scoring:
  trend:
    bias-threshold: 5.0
  cross-section:
    enabled: false
  # 多维度：仅用库内 K 线+PE+行业聚合计算，不拉取外部 API
  multi-dim:
    compute-only-v1: true

quant:
  auth:
    enabled: false
    # 生产环境必须通过环境变量覆盖；下方仅为开发默认值，启动时若沿用会打印告警
    jwt-secret: ${JWT_SECRET:quant-dev-secret-change-me-in-production-32b}
    jwt-expiration-hours: 72
    default-admin-username: ${DEFAULT_ADMIN_USERNAME:admin}
    default-admin-password: ${DEFAULT_ADMIN_PASSWORD:admin123}
    default-sim-cash: 1000000
  scoring:
    cross-section:
      enabled: false
      min-std: 0.000001
    advice:
      strong-buy: 85
      buy: 70
      hold: 55
      watch: 30
    decay:
      technical-half-life-days: 5
      news-half-life-days: 2
      fundamental-half-life-days: 90
    dynamic-weights:
      market-env-ratio: 0.6
      stock-char-ratio: 0.4
      market-weights:
        牛市: [0.3, 0.5, 0.2]
        熊市: [0.4, 0.3, 0.3]
        震荡市: [0.35, 0.30, 0.35]
      stock-type-weights:
        价值股: [0.3, 0.5, 0.2]
        成长股: [0.35, 0.45, 0.2]
        周期股: [0.4, 0.3, 0.3]
        防御股: [0.25, 0.4, 0.35]
        普通股: [0.33, 0.34, 0.33]
