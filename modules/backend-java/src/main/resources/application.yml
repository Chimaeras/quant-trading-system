server:
  port: 8080
  # 前端与 API 同端口，访问 http://localhost:8080/ 查看页面

spring:
  application:
    name: quant-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/quant_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms

# JWT 配置
jwt:
  secret: quant-trading-system-secret-key-2026-change-in-production
  expiration: 86400000  # 24小时

# 日志配置
logging:
  level:
    root: INFO
    com.quant: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 历史行情：搜狐为主时一般无需再拉东财；为 true 时在搜狐有数据时仍拉东财并合并（搜狐优先，东财补缺）
historical:
  supplement-eastmoney: false

# 趋势选股打分（与《选股打分算法说明》一致）
scoring:
  trend:
    bias-threshold: 5.0
  cross-section:
    enabled: false
  # 多维度：仅用库内 K 线+PE+行业聚合计算，不拉取外部 API
  multi-dim:
    compute-only-v1: true

quant:
  scoring:
    cross-section:
      enabled: false
      min-std: 0.000001
    advice:
      strong-buy: 85
      buy: 70
      hold: 55
      watch: 30
    gdelt:
      risk-red: 0.4
      risk-yellow: 0.2
      lambda: 0.1
      event-weights:
        "01": 0.6
        "04": 0.4
        "12": 0.3
        default: 0.1
    news:
      preferred-boost: 1.5
    decay:
      technical-half-life-days: 5
      news-half-life-days: 2
      fundamental-half-life-days: 90
    dynamic-weights:
      market-env-ratio: 0.6
      stock-char-ratio: 0.4
      market-weights:
        牛市: [0.3, 0.5, 0.2]
        熊市: [0.4, 0.3, 0.3]
        震荡市: [0.35, 0.30, 0.35]
      stock-type-weights:
        价值股: [0.3, 0.5, 0.2]
        成长股: [0.35, 0.45, 0.2]
        周期股: [0.4, 0.3, 0.3]
        防御股: [0.25, 0.4, 0.35]
        普通股: [0.33, 0.34, 0.33]

backtest:
  cost:
    commission-rate: 0.0003
    min-commission: 5.0
    stamp-duty-rate: 0.001
    transfer-fee-rate: 0.00002
    slippage-bps: 2.0

llm:
  base-url: ${LLM_BASE_URL:http://220.241.121.166:38000}
  api-key: ${LLM_API_KEY:123456}
  model: ${LLM_MODEL:glm-5-fp8}
  temperature: ${LLM_TEMPERATURE:0.3}
  max-tokens: ${LLM_MAX_TOKENS:1024}
  connect-timeout-ms: ${LLM_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${LLM_READ_TIMEOUT_MS:120000}
  enable-stream: ${LLM_ENABLE_STREAM:true}
  session-max-messages: ${LLM_SESSION_MAX_MESSAGES:20}
