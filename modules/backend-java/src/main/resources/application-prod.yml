# Production profile: schema is managed by Flyway only; Hibernate must not mutate DDL.
# Activate with: --spring.profiles.active=prod
# Credentials via env placeholders only — never commit real passwords.

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:quant_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=${DB_SSL:true}&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

quant:
  auth:
    enabled: ${AUTH_ENABLED:true}
    jwt-secret: ${JWT_SECRET:}
    default-admin-username: ${DEFAULT_ADMIN_USERNAME:}
    default-admin-password: ${DEFAULT_ADMIN_PASSWORD:}

logging:
  level:
    root: INFO
    com.quant: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
