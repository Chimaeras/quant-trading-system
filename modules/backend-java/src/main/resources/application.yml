server:
  port: 8080
  # 前端与 API 同端口，访问 http://localhost:8080/ 查看页面

spring:
  application:
    name: quant-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/quant_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  # Flyway: app schema source of truth (see classpath:db/migration)
  flyway:
    enabled: true
    locations: classpath:db/migration
    # First adoption on existing DBs that already have tables from ddl-auto / ops scripts
    baseline-on-migrate: true
  jpa:
    hibernate:
      # DDL 全部由 Flyway 管理，dev 也使用 validate——避免 Hibernate 擅自加列绕过版本化迁移，
      # 造成 schema 双真相源。新增字段/表请编写新的 Flyway 迁移脚本。
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
    open-in-view: false

# 日志配置
logging:
  level:
    root: INFO
    com.quant: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [%X{correlationId:-}] - %msg%n"

# 历史行情：搜狐为主时一般无需再拉东财；为 true 时在搜狐有数据时仍拉东财并合并（搜狐优先，东财补缺）
historical:
  supplement-eastmoney: false

# 趋势选股打分（与《选股打分算法说明》一致）
scoring:
  trend:
    bias-threshold: 5.0
  cross-section:
    enabled: false
  # 多维度：仅用库内 K 线+PE+行业聚合计算，不拉取外部 API
  multi-dim:
    compute-only-v1: true

quant:
  auth:
    enabled: false
    # 生产环境必须通过环境变量覆盖；下方仅为开发默认值，启动时若沿用会打印告警
    jwt-secret: ${JWT_SECRET:quant-dev-secret-change-me-in-production-32b}
    jwt-expiration-hours: 72
    default-admin-username: ${DEFAULT_ADMIN_USERNAME:admin}
    default-admin-password: ${DEFAULT_ADMIN_PASSWORD:admin123}
    default-sim-cash: 1000000
  # T 日收盘后自动生成次日候选清单（DS-R030）。
  # enabled 默认 false —— 与「默认观察、不自动产生交易动作」的既有约定一致；
  # 需自动产出时显式置 true（或 -Dquant.t1.schedule.enabled=true）。
  # 无论开关如何，本任务只写 t1_candidate 快照，不触碰任何下单接口。
  t1:
    schedule:
      enabled: false
      # 收盘后 15:10（上海时区）；周一至周五，实际是否执行仍由交易日历二次判定
      cron: "0 10 15 * * MON-FRI"
      # 漏跑自愈：在最近 N 个自然日内找最近一个「日历确认已收盘且有行情」的交易日
      lookback-days: 10
    # T+1 次日候选入选门禁（D-T1-07，2026-10-14 修正）。
    # 阈值必须与 scoreT1 的公式口径同步变更；改动前请先跑标定脚本重取实证分布。
    eligibility:
      # rule_score 入选下限（可行域 0-50，截面排序分，非概率）。
      # 标定证据：2026-08-04..2026-10-13 共 45 个信号日、逐日复现生产打分池。
      #   阈值 35 → 日均 3.4 只、45 日中 4 日零候选（8.9%）
      #   阈值 30 → 日均 8.6 只、45 日中 1 日零候选（2.2%）
      #   阈值 25 → 日均 23.8 只、零候选 0 日
      # 预测力证据（2026-06-01..2026-10-13，326,783 样本，次日开盘买→次日收盘）：
      #   score ∈ [20,25) +0.322% / [25,30) +0.562% / [30,35) +1.016% / [35,50] +1.179%
      #   全市场同口径基准 +0.181%，胜率 51.00%
      # 取 30：预测力已在 [30,35) 显著抬升（约为 [25,30) 的 1.8 倍），
      # 同时把零候选日压到 2.2%，纠正「候选清单长期恒空」。
      rule-score-threshold: 30.0
      # 门禁版本标识：改动阈值须同步升版本，便于按版本回溯历史快照。
      threshold-version: t1_rule_v3
  scoring:
    cross-section:
      enabled: false
      min-std: 0.000001
    advice:
      strong-buy: 85
      buy: 70
      hold: 55
      watch: 30
    decay:
      technical-half-life-days: 5
      news-half-life-days: 2
      fundamental-half-life-days: 90
    dynamic-weights:
      market-env-ratio: 0.6
      stock-char-ratio: 0.4
      market-weights:
        牛市: [0.3, 0.5, 0.2]
        熊市: [0.4, 0.3, 0.3]
        震荡市: [0.35, 0.30, 0.35]
      stock-type-weights:
        价值股: [0.3, 0.5, 0.2]
        成长股: [0.35, 0.45, 0.2]
        周期股: [0.4, 0.3, 0.3]
        防御股: [0.25, 0.4, 0.35]
        普通股: [0.33, 0.34, 0.33]
