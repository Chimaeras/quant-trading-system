server:
  port: 8080
  # 前端与 API 同端口，访问 http://localhost:8080/ 查看页面

spring:
  application:
    name: quant-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/quant_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms

# JWT 配置
jwt:
  secret: quant-trading-system-secret-key-2026-change-in-production
  expiration: 86400000  # 24小时

# 日志配置
logging:
  level:
    root: INFO
    com.quant: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

backtest:
  cost:
    commission-rate: 0.0003
    min-commission: 5.0
    stamp-duty-rate: 0.001
    transfer-fee-rate: 0.00002
    slippage-bps: 2.0
